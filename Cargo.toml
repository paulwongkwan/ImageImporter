[package]
name = "image_importer"
version = "0.1.0"
edition = "2024"
description = "Batch import photos and RAW files into year / year-month-day folders on Windows 11."

[dependencies]
chrono = "0.4.45"
gpui-kit = "0.9.0"
kamadak-exif = "0.6"
rfd = "0.17.2"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 2
